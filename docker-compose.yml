version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: veritas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: veritas_db
      MYSQL_USER: veritas_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: